<path d="M212 269 L212 312" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M962 269 L962 312" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
