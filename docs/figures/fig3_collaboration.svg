<line x1="212" y1="158" x2="212" y2="201" stroke="#2E5AAC" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowBlue)"/>
<line x1="587" y1="158" x2="587" y2="201" stroke="#2E5AAC" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowBlue)"/>
