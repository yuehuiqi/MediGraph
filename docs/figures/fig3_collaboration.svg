<text x="730" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">SQLite read-only</text>
<rect x="890" y="512" width="226" height="58" rx="12" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.6"/>
<text x="1003" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">0.8B planner</text>
<text x="1003" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">local chat-completions API</text>

<!-- legend -->
<rect x="160" y="634" width="860" height="48" rx="12" fill="#FBFCFE" stroke="#D7DEE8" stroke-width="1.6"/>
<text x="590" y="653" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Line legend</text>
<text x="590" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">blue dashed = managed agents; purple dashed = A2A; gray/dark dashed = MCP tool calls and backends</text>
</svg>
