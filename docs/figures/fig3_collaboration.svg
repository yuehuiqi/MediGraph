<text x="460" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">LocalStore / Neo4j optional</text>
<rect x="620" y="512" width="220" height="58" rx="12" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.6"/>
