<line x1="1000" y1="466" x2="1000" y2="508" stroke="#526174" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/>

<!-- A2A -> planner along the right margin, no crossings -->
<path d="M1080 97 L1146 97 L1146 541" fill="none" stroke="#6A4C93" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="1146" y1="541" x2="1116" y2="541" stroke="#6A4C93" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>

