<rect x="0" y="0" width="1180" height="520" fill="#FFFFFF"/>
<text x="590" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172033">Fig. 5  MedFusion-Softmax Device-Side Fusion Flow (Ascend C)</text>

<!-- inputs -->
