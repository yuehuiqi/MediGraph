<rect x="555" y="190" width="125" height="66" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="617.5" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#172033">ReduceMax</text>
<text x="617.5" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#526174">row max</text>
