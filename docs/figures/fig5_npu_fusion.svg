<text x="1082.5" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#526174">write GM</text>

<!-- output -->
<rect x="1010" y="78" width="140" height="50" rx="8" fill="#E5F3EA" stroke="#2E8B57" stroke-width="1.6"/>
<text x="1080" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#172033">GM prob</text>
<text x="1080" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#526174">output matrix</text>
<line x1="1082" y1="190" x2="1082" y2="132" stroke="#2E8B57" stroke-width="2" marker-end="url(#arrowGreen)"/>

<!-- UB note -->
<rect x="70" y="378" width="1040" height="58" rx="12" fill="#FBFCFE" stroke="#D7DEE8" stroke-width="1.6"/>
<text x="590" y="401" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">UB fusion</text>
<text x="590" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">Temperature scaling, label mask and softmax intermediates stay in UB; mask is reused per core</text>

<!-- measured results -->
<rect x="240" y="456" width="700" height="44" rx="12" fill="#F8E7E3" stroke="#B5402F" stroke-width="1.6"/>
<text x="590" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#B5402F">Measured: fused throughput 3.12x vs torch_npu, board energy efficiency about 3.00x</text>
<text x="590" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">profiler CSV, 5 repeated runs and source.sha256 included in NPU/NPU_results</text>
</svg>
