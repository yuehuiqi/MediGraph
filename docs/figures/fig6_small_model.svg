<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2E5AAC"/></marker>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6A4C93"/></marker>
</defs>
<rect x="0" y="0" width="1180" height="560" fill="#FFFFFF"/>
<text x="590" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172033">Fig. 6  0.8B Planner: Natural Language Request to Operator DAG</text>

<!-- top pipeline -->
<rect x="70" y="120" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="165" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">User request</text>
<text x="165" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">clean / extract / validate</text>
<rect x="320" y="120" width="220" height="62" rx="12" fill="#E8EFFA" stroke="#2E5AAC" stroke-width="1.6"/>
<text x="430" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Synthetic dataset</text>
<text x="430" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">19 patterns / 1126 pairs</text>
<rect x="600" y="120" width="220" height="62" rx="12" fill="#F5F1FA" stroke="#6A4C93" stroke-width="1.6"/>
<text x="710" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Qwen3.5-0.8B LoRA</text>
<text x="710" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">DAG planner</text>
<rect x="880" y="120" width="220" height="62" rx="12" fill="#F5F1FA" stroke="#6A4C93" stroke-width="1.6"/>
<text x="990" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Local API service</text>
<text x="990" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">/v1/chat/completions</text>
<line x1="260" y1="151" x2="320" y2="151" stroke="#2E5AAC" stroke-width="2" marker-end="url(#arrowBlue)"/>
<line x1="540" y1="151" x2="600" y2="151" stroke="#2E5AAC" stroke-width="2" marker-end="url(#arrowBlue)"/>
<line x1="820" y1="151" x2="880" y2="151" stroke="#2E5AAC" stroke-width="2" marker-end="url(#arrowBlue)"/>

<!-- API -> planner output (orthogonal) -->
<path d="M990 182 L990 221 L590 221" fill="none" stroke="#6A4C93" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="590" y1="221" x2="590" y2="256" stroke="#6A4C93" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>

<!-- planner output -->
<rect x="280" y="260" width="620" height="70" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="590" y="287" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">Planner output</text>
<text x="590" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#526174">[{id:n1, op:text_clean, deps:[]}, ..., {op:triple_validator}]</text>

<!-- output -> evaluation row -->
<line x1="590" y1="330" x2="590" y2="366" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">held-out evaluation (112 cases)</text>

<!-- comparison row -->
<rect x="105" y="390" width="210" height="58" rx="12" fill="#FFFFFF" stroke="#526174" stroke-width="1.6"/>
<text x="210" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Base 0.8B</text>
<text x="210" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">DAG accuracy 0.161</text>
<rect x="365" y="390" width="210" height="58" rx="12" fill="#E5F3EA" stroke="#2E8B57" stroke-width="1.6"/>
<text x="470" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">LoRA 0.8B</text>
<text x="470" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">DAG accuracy 0.973</text>
<rect x="625" y="390" width="210" height="58" rx="12" fill="#FFF3E4" stroke="#C9732B" stroke-width="1.6"/>
<text x="730" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">35B API baseline</text>
<text x="730" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">DAG accuracy 0.741</text>
<rect x="885" y="390" width="210" height="58" rx="12" fill="#E5F3EA" stroke="#2E8B57" stroke-width="1.6"/>
<text x="990" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Executable rate</text>
<text x="990" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">LoRA 1.000</text>

<!-- caption -->
<rect x="210" y="482" width="760" height="44" rx="12" fill="#FBFCFE" stroke="#D7DEE8" stroke-width="1.6"/>
<text x="590" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Design split</text>
<text x="590" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#526174">the small model plans workflows; large/neural models handle semantic extraction and hard cases</text>
</svg>
