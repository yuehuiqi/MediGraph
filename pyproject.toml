[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medigraph-agent"
version = "2.0.0"
description = "Medical data-to-knowledge-to-insight agent for the ModelEngine competition"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MediGraph Agent contributors"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["finetune/outputs", "NPU"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
